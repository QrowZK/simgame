name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: No-Godot-reference check
        run: ./tools/check-no-godot-reference.sh

      - name: Generated data is up to date with the spec
        run: |
          python3 tools/generate_data.py
          git diff --exit-code -- data/ \
            || { echo "::error::data/ is stale. Run 'python3 tools/generate_data.py' and commit the result."; exit 1; }

      - name: Restore
        run: dotnet restore

      - name: Build (zero warnings)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build
