name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: No-Godot-reference check
        run: ./tools/check-no-godot-reference.sh

      - name: Generated data is up to date with the spec
        run: |
          python3 tools/generate_data.py
          git diff --exit-code -- data/ \
            || { echo "::error::data/ is stale. Run 'python3 tools/generate_data.py' and commit the result."; exit 1; }

      - name: Restore
        run: dotnet restore

      - name: Build (zero warnings)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build

  godot:
    name: Godot layer launches
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${NAME}.zip"
          unzip -q godot.zip
          chmod +x "${NAME}/Godot_v${GODOT_VERSION}_mono_linux.x86_64"

      - name: Build game assembly
        run: dotnet build game/Game.csproj -warnaserror

      - name: Import assets
        working-directory: game
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64
          "$GODOT" --headless --import

      # Definition of done: the project must actually launch, not just compile.
      - name: Launch headless
        working-directory: game
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64
          "$GODOT" --headless --quit

      # Drives the real render path: ticks the sim and refills instance buffers.
      - name: Headless smoke test
        working-directory: game
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64
          "$GODOT" --headless -- --smoke --machines=4096 | tee smoke.log
          grep -q "=== SMOKE OK ===" smoke.log
          # Clicking a large machine must resolve to that one machine from any
          # of its tiles -- the whole inspection GUI hangs off this.
          grep -q "all tiles resolve to one machine: True" smoke.log
          # Drones have to actually reach the renderer, and the controller has
          # to compile. A fleet that exists only in the sim is not rendered.
          grep -qE "drones          [0-9]+ instances=[1-9]" smoke.log
          grep -q "controllers     1 error=none" smoke.log
          # Accumulators must exist and be taking charge: a bank that is on no
          # network stores nothing and would pass a count-only check.
          grep -qE "accumulators    [1-9][0-9]* stored=[1-9]" smoke.log
          # Belts: tiles compile into segments, and a long straight run must
          # stay ONE segment -- a segment per tile would throw away the whole
          # reason a lane advances in O(1). Items have to reach the renderer
          # too: a belt nobody can see anything moving on is a grey strip.
          grep -qE "belts           tiles=[1-9][0-9]* segments=[1-9] inserters=[1-9]" smoke.log
          grep -qE "belts .* items drawn=[1-9][0-9]*" smoke.log
          # Build mode: the menu offers something and the ghost actually
          # appears. A build UI that lists machines and previews nothing looks
          # fine in a screenshot and cannot be used.
          grep -qE "build menu      offered=[1-9][0-9]* holding=.+ ghost=True" smoke.log
          grep -q "build closed    menu=False ghost=False" smoke.log
          # The recipe picker on a placed machine. It photographs as an empty
          # box when it is broken -- a null catalogue at bind time did exactly
          # that -- so the smoke run asks it how many recipes it is offering and
          # whether the running one is the highlighted row.
          grep -qE "recipe picker   options=[1-9][0-9]* current selected=True" smoke.log
          # Underground belts and splitters have to reach the renderer too. A
          # tunnel end drawn as nothing is indistinguishable from a tunnel that
          # was never placed, which is the belt bug hardest to see by eye.
          grep -qE "belt parts      undergrounds=[1-9][0-9]* splitters=[1-9][0-9]* solids drawn=[1-9][0-9]* arrows drawn=[1-9][0-9]*" smoke.log
          # Terrain still rebuilds, and within the frame budget it was cached
          # to hit. A rebuild that quietly went back to 39 ms is a hitch every
          # time the camera crosses a tile boundary.
          grep -qE "terrain rebuild [0-9]+x[0-9]+ tiles in [0-9.]+ ms" smoke.log
          awk '/^terrain rebuild/ { if ($6 + 0 > 60) { print "::error::terrain rebuild took " $6 " ms"; exit 1 } }' smoke.log
          # Water is recessed into real pools, and no screenshot can prove that
          # -- a blue plate and a hole look identical from above. The renderer
          # walks out to the coast and reports what it drew there, so a change
          # that flattens the sea back into painted tiles fails here instead of
          # being noticed months later.
          grep -qE "terrain water   tiles=[1-9][0-9]* deepest=[0-9.]+ below land" smoke.log
          awk '/^terrain water/ { split($3, d, "="); if (d[2] + 0 < 0.1) { print "::error::" $0 " -- water is not recessed; pools are being drawn flat"; exit 1 } }' smoke.log
          # Item icons: the atlas is committed and regenerated by hand, so the
          # only thing between a stale atlas and a menu of blank rows is that
          # every item still resolves to an icon BY ID. Compare the two counts
          # rather than pinning 617, which would fail on every new item.
          grep -qE "item icons      known=[0-9]+ of [0-9]+" smoke.log
          awk '/^item icons/ { split($3, k, "="); if (k[2] + 0 < 1 || k[2] != $5) { print "::error::" $0 " -- an item has no icon; regenerate game/icons with tools/generate_icons.py"; exit 1 } }' smoke.log

      # The save loop as a player takes it: new game, save to disk, list it,
      # load it back, and stay identical after running on. The unit tests stop
      # at the sim boundary and never touch the file layer.
      - name: Save/load session test
        working-directory: game
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64
          "$GODOT" --headless -- --session-test | tee session.log
          grep -q "=== SESSION OK ===" session.log
          grep -q "round trip      identical: True" session.log
          grep -q "after 2000      identical: True" session.log
          # Starting a game with nothing and mining your way up is the opening
          # loop; if it breaks, the game is unplayable whatever the units say.
          grep -q -- "--- start flow ok ---" session.log

      # New Game, through the menu, with the seed the menu invents. Everything
      # else builds its world directly and skips the button entirely, which is
      # how a release shipped that could not start one (ADR 0027).
      - name: New Game works from the menu
        working-directory: game
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64
          "$GODOT" --headless -- --menu-test | tee menu.log
          grep -q "=== MENU OK ===" menu.log
          grep -q "research        present" menu.log
          # Not seed 0 every time: the "surprise me" seed used to overflow to
          # zero, so every random world was the same world.
          grep -qE "menu seed       [1-9][0-9]+" menu.log
          grep -q "miner built     True" session.log
          # F2 (ADR 0026): the opening is only playable if the first thing the
          # survey device points at is something the player can use. "an ore
          # exists within 400 tiles" was true on every seed while 18 of 20 put
          # halite nearest, so the rank is what is asserted, not the existence.
          grep -qE "first usable    [a-z_]+ at [0-9]+ tiles, rank 1 of [0-9]+" session.log
          grep -q "ground fell     True" session.log
          # Power: a machine that needs electricity is dark until a pole reaches
          # it and a fuelled generator feeds the network.
          grep -q -- "--- power ok ---" session.log
          grep -q "unpowered       state=Unpowered" session.log
          grep -q "powered         state=Working" session.log
          # Storage: surplus reaches an accumulator, and a part-full bank
          # survives the save round trip above rather than reloading empty.
          grep -qE "stored          [1-9][0-9]*/[0-9]+" session.log
          grep -q "storage         .*part-full: True" session.log
          # Building: a new game must be able to place something from its
          # starter kit, refuse a second one on the same tile, and refuse a
          # machine with no recipe chosen. If a new game can build nothing,
          # the opening loop is unplayable whatever the unit tests say.
          grep -q -- "--- building ok ---" session.log
          grep -qE "can build       [1-9][0-9]* kinds" session.log
          grep -q "built           Ok" session.log
          grep -q "same tile       Blocked" session.log
          grep -q "no recipe       NeedsRecipe" session.log
          # The bench is the ONLY thing a starter kit can place, and the whole
          # steam tier is crafted on it. If it ever stops being offered, the
          # game has no opening move at all.
          grep -q "holding         Crafting Bench" session.log
          # The opening route, played end to end on what a new game is given:
          # one bench, 24 stone and the ground. The milestone is a steam miner
          # in the player's hands, which needs ten distinct bench recipes on the
          # one bench a player can ever have -- so this is red unless a placed
          # machine can be retasked (docs/0021). The old "--- building ok ---"
          # passed on a bench placed on a recipe it could never complete.
          grep -q -- "--- opening route ok ---" session.log
          grep -q "stuck on        nothing" session.log
          grep -qE "bench recipes   1[0-9]+ distinct on one bench" session.log
          grep -q "miner placed    Ok" session.log
          # Belts: a run laid tile by tile from the inventory, an inserter at
          # the end of it, and ore actually arriving in a machine that had
          # none. Getting an inserter's reach wrong is silent -- it just holds
          # an item forever -- so the assertion is that ore arrived.
          grep -q -- "--- belts ok ---" session.log
          grep -qE "laid            [1-9] belt tiles" session.log
          grep -q "reached machine True" session.log
          grep -q "spilled         0" session.log
          # Fluids: water pumped from a lake, piped inland, and consumed by a
          # machine. The whole chain, with nothing hand-fed.
          grep -q -- "--- fluids ok ---" session.log
          grep -q "pump built      True" session.log
          grep -q "washer state    Working" session.log
