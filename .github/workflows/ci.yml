name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: No-Godot-reference check
        run: ./tools/check-no-godot-reference.sh

      - name: Restore
        run: dotnet restore

      - name: Build (zero warnings)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build
